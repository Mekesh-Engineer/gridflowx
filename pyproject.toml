[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridflowx"
version = "3.0.0"
description = "GridFlowX: Smart AI-Driven Microgrid Management and Automation System"
authors = [{ name = "GridFlowX Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "websockets>=13.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "aiohttp>=3.10.5",
    "tenacity>=9.0.0",
    "numpy>=1.26.4",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "langgraph>=0.2.28",
    "supabase>=2.11.0",
]

[tool.vercel]
entrypoint = "backend/main.py"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "backend/tests",
    "agentic-ai/evaluation",
]
python_files = ["test_*.py", "*_test.py"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
